<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Photos — Boston Portrait & Wedding Photographer</title>

    <!-- STYLES CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- NAVIGATION (ESTRUCTURA EXACTA DE CONTACT) -->
    <header class="nav">
        <div class="nav-left desktop-links">
            <a href="Aboutme.html">ABOUT</a>
            <a href="contact.html">CONTACT + INFO</a>
        </div>

        <a href="index.html" class="logo">
            <span class="logo-line1">OLIVE PHOTOS</span>
        </a>

        <div class="nav-right">
            <button class="menu-btn" id="menuBtn">MENU +</button>
        </div>
    </header>

    <!-- FULLSCREEN MENU (ESTRUCTURA EXACTA DE CONTACT) -->
    <div class="fullscreen-menu" id="fullscreenMenu">
        <div class="menu-inner">
            <nav class="fullscreen-nav">
                <a href="index.html">HOME</a>
                <a href="Aboutme.html">ABOUT</a>
                <a href="contact.html">CONTACT + INFO</a>
            </nav>

            <div class="menu-footer">
                <a href="https://instagram.com/oliveephotos" target="_blank">@oliveephotos</a>
                <span>•</span>
                <a href="mailto:oliveephotos@gmail.com">Email</a>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT: FILTROS + GALERÍA MASONRY -->
    <main class="main-content">

        <!-- BARRA DE FILTROS -->
        <nav class="filter-bar">
            <button class="filter-btn active" data-filter="all">ALL</button>
            <button class="filter-btn" data-filter="portraits">PORTRAITS</button>
            <button class="filter-btn" data-filter="studio">STUDIO</button>
            <button class="filter-btn" data-filter="wedding">WEDDING</button>
            <button class="filter-btn" data-filter="event">EVENTS</button>
        </nav>

        <!-- GALERÍA MASONRY -->
        <section class="grid-container">
            <div class="gallery-grid" id="fullGallery"></div>
        </section>

    </main>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">×</button>
        <img src="" alt="Enlarged photo view" id="lightbox-img">
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Page Fade In & Transitions
        window.addEventListener("load", () => {
            document.body.classList.add("loaded");
        });

        document.querySelectorAll("a").forEach(link => {
            link.addEventListener("click", function (e) {
                const href = this.getAttribute("href");
                if (href && !href.startsWith("#") && !href.startsWith("http") && !href.startsWith("mailto:")) {
                    e.preventDefault();
                    document.body.classList.remove("loaded");
                    setTimeout(() => { window.location = href; }, 400);
                }
            });
        });

        // Fullscreen Menu (Lógica exacta de Contact)
        const menuBtn = document.getElementById("menuBtn");
        const fullscreenMenu = document.getElementById("fullscreenMenu");

        if (menuBtn && fullscreenMenu) {
            menuBtn.addEventListener("click", () => {
                fullscreenMenu.classList.toggle("active");
                menuBtn.textContent = fullscreenMenu.classList.contains("active") ? "MENU ×" : "MENU +";
            });
        }

        // Scroll Navbar Behavior (Comportamiento dinámico)
        const nav = document.querySelector(".nav");
        let lastScrollY = window.scrollY;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.scrollY;
            if (currentScrollY < 0) return;

            if (currentScrollY > lastScrollY && currentScrollY > 50) {
                nav.classList.add("nav-hidden");
            } else {
                nav.classList.remove("nav-hidden");
            }
            lastScrollY = currentScrollY;
        });

        // BASE DE DATOS EXACTA DE FOTOS
        const portraitImages = [
            "img/IMG_9191.jpg", "img/IMG_9192.jpg", "img/IMG_9190.jpg",
            "img/IMG_1057.jpg", "img/IMG_1016.jpg", "img/IMG_1063.jpg",
            "img/IMG_1107.jpg", "img/IMG_1162.jpg", "img/IMG_1163.jpg",
            "img/4G6A0077.jpg", "img/4G6A0088.jpg", "img/4G6A0123.jpg",
            "img/IMG_0331.jpg", "img/IMG_0315.jpg", "img/IMG_0340.jpg",
            "img/IMG_1663.jpg", "img/IMG_1675.jpg", "img/IMG_1671.jpg"
        ];

        const studioImages = [
            "img/IMG_3529.jpg", "img/IMG_3587.jpg", "img/IMG_3535.jpg",
            "img/IMG_8333.jpg", "img/IMG_8343.jpg", "img/IMG_8356.jpg",
            "img/Studio Session-454.jpg", "img/Studio Session-464.jpg", "img/Studio Session-445.jpg",
            "img/Studio Session-477.jpg", "img/Studio Session-463.jpg", "img/Studio Session-4466.jpg",
            "img/4G6A0322.jpg", "img/4G6A0310.jpg", "img/4G6A0365.jpg"
        ];

        const weddingImages = [
            "img/IMG_3681.jpg", "img/4G6A8892.jpg", "img/4G6A8942.jpg",
            "img/4G6A8943.jpg", "img/IMG_3661.jpg", "img/IMG_3655.jpg",
            "img/IMG_1255.jpg", "img/IMG_1207.jpg", "img/IMG_1216.jpg",
            "img/IMG_1275.jpg", "img/IMG_1119.jpg"
        ];

        const eventImages = [
            "img/IMG_1451.jpg", "img/IMG_1429.jpg", "img/IMG_1446.jpg",
            "img/IMG_1420.jpg", "img/IMG_1440.jpg"
        ];

        const allPhotos = [
            ...portraitImages.map(src => ({ src, category: "portraits" })),
            ...studioImages.map(src => ({ src, category: "studio" })),
            ...weddingImages.map(src => ({ src, category: "wedding" })),
            ...eventImages.map(src => ({ src, category: "event" }))
        ];

        // MOTOR MASONRY
        let currentFilter = "all";
        const aspectCache = new Map();

        function getAspectRatio(src) {
            if (aspectCache.has(src)) return Promise.resolve(aspectCache.get(src));
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const ratio = img.naturalHeight / img.naturalWidth || 1.3;
                    aspectCache.set(src, ratio);
                    resolve(ratio);
                };
                img.onerror = () => resolve(1.3);
                img.src = src;
            });
        }

        function getColumnCount() {
            const w = window.innerWidth;
            if (w <= 600) return 1;
            if (w <= 1024) return 2;
            return 3;
        }

        async function renderGallery() {
            const container = document.getElementById("fullGallery");
            if (!container) return;
            container.innerHTML = "";

            const filteredPhotos = currentFilter === "all"
                ? allPhotos
                : allPhotos.filter(p => p.category === currentFilter);

            const cols = getColumnCount();
            const columns = [];
            const heights = new Array(cols).fill(0);

            for (let i = 0; i < cols; i++) {
                const col = document.createElement("div");
                col.className = "gallery-col";
                container.appendChild(col);
                columns.push(col);
            }

            for (const photo of filteredPhotos) {
                const ratio = await getAspectRatio(photo.src);

                let minIndex = 0;
                for (let i = 1; i < cols; i++) {
                    if (heights[i] < heights[minIndex]) minIndex = i;
                }

                const item = document.createElement("div");
                item.className = "gallery-item";

                const img = document.createElement("img");
                img.src = photo.src;
                img.alt = "";
                img.loading = "lazy";
                item.appendChild(img);

                item.addEventListener("click", () => openLightbox(photo.src));

                columns[minIndex].appendChild(item);
                heights[minIndex] += ratio + 0.03;
            }
        }

        const filterBtns = document.querySelectorAll(".filter-btn");
        filterBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                filterBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentFilter = btn.getAttribute("data-filter");
                renderGallery();
            });
        });

        renderGallery();

        let lastColumnCount = getColumnCount();
        let resizeTimer;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const current = getColumnCount();
                if (current !== lastColumnCount) {
                    lastColumnCount = current;
                    renderGallery();
                }
            }, 200);
        });

        // LIGHTBOX
        const lightbox = document.getElementById("lightbox");
        const lbImg = document.getElementById("lightbox-img");
        const lbClose = document.getElementById("lightboxClose");

        function openLightbox(src) {
            lbImg.src = src;
            lightbox.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lightbox.classList.remove("active");
            document.body.style.overflow = "";
        }

        lbClose.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox) closeLightbox();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") closeLightbox();
        });
    </script>
</body>

</html>
